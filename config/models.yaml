# Which model fills each role. Changing a model is a change to this file only,
# and ships only if that role's evaluation suite passes at least as well.
# Product decision (2026-10-08): Anthropic models for every role.

roles:
  router:
    primary:  { provider: anthropic, model: claude-haiku-5-5, effort: low }
    fallback: { provider: anthropic, model: claude-sonnet-5-5, effort: low, serverFallback: true }
    maxTokens: 2000
    maxLatencyMs: 1500

  spec_writer:
    primary:  { provider: anthropic, model: claude-opus-5-5, effort: low, serverFallback: true }
    fallback: { provider: anthropic, model: claude-sonnet-5-5, effort: medium, serverFallback: true }
    maxTokens: 16000
    maxLatencyMs: 6000

  screen_composer:
    primary:  { provider: anthropic, model: claude-sonnet-5-5, effort: low, serverFallback: true }
    fallback: { provider: anthropic, model: claude-haiku-5-5, effort: medium }
    maxTokens: 4000
    maxLatencyMs: 2500

  explainer:
    primary:  { provider: anthropic, model: claude-sonnet-5-5, effort: medium, serverFallback: true }
    fallback: { provider: anthropic, model: claude-opus-5-5, effort: medium, serverFallback: true }
    maxTokens: 4000
    maxLatencyMs: 3000

  # Deliberately a different model from spec_writer, so their mistakes are less likely
  # to coincide. Deterministic checks (numbers, sources) run in code before this role.
  verifier:
    primary:  { provider: anthropic, model: claude-sonnet-5-5, effort: medium, serverFallback: true }
    fallback: { provider: anthropic, model: claude-opus-5-5, effort: medium, serverFallback: true }
    maxTokens: 4000
    maxLatencyMs: 3000

  # Suggests which payroll column holds which field. Sees headers and value shapes only.
  column_matcher:
    primary:  { provider: anthropic, model: claude-haiku-5-5, effort: low }
    fallback: { provider: anthropic, model: claude-sonnet-5-5, effort: low, serverFallback: true }
    maxTokens: 2000
    maxLatencyMs: 3000

# US dollars per million tokens, for cost logging only.
pricing:
  claude-opus-5-5:   { input: 4.00, output: 20.00 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  claude-haiku-5-5:  { input: 0.10, output: 0.50 }
